spring.application.name=installment-schedule-generator

# Server
server.port=9090

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/installment_schedule_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
app.jwt.secret=change-this-to-a-long-random-string
app.jwt.expiry-hours=8

# Admin seed
app.admin.email=admin@example.com
app.admin.password=Admin@123
app.admin.name=Administrator

# Logging
logging.level.com.installment=DEBUG
logging.level.org.springframework.security=WARN

